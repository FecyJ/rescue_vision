# 正式流程：首轮搜索最近单绿；其走廊不安全时直接解团；一般阶段按不同 X 终点优先寻找可抓取物资组。
# 本文件以启动区域 2（地图右上角、红方）为坐标基准；区域 3 通过
# rescue-vision-match 的 --start-area 3 在运行时做中心对称并切换为蓝方。

camera:
  backend: rpicam_vid
  image_size: [2304, 1296]
  fps: 20
  lens_position: 0.9687536954879761

geometry:
  intrinsics_enabled: true
  intrinsics_path: ../src/rescue_vision/calibration/output/intrinsics_20260723_154106/selected_calibration.json
  ground_mapping_enabled: true
  ground_mapping_path: ../src/rescue_vision/calibration/output/ground_mapping_debug_near_field_20260823_092445_925685/ground_mapping_debug_near_field.json

processing:
  max_observation_age_ms: 800.0

perception:
  safe_zone_color:
    enabled: true
    red_hsv_ranges:
      - lower: [0, 100, 35]
        upper: [10, 255, 255]
      - lower: [170, 100, 35]
        upper: [179, 255, 255]
    blue_hsv_ranges:
      - lower: [90, 70, 35]
        upper: [120, 255, 255]
    min_fraction: 0.08
    min_margin: 0.03

uart:
  enabled: true
  device: /dev/serial0
  read_timeout_ms: 100.0
  write_timeout_ms: 100.0
  receive_queue_capacity: 256

remote:
  enabled: false
  role: server
  host: 0.0.0.0
  port: 8765
  access_mode: observe_only

motion:
  enabled: true
  wheel_track_m: 0.235
  max_linear_velocity_m_s: 1
  max_angular_velocity_rad_s: 2
  max_wheel_velocity_m_s: 2
  max_wheel_acceleration_m_s2: 2
  # 减速电机的非零单轮最低目标速度；低于该值的轮速会提升到该值。
  min_wheel_velocity_m_s: 0.02
  left_wheel_speed_weight: 1.0
  right_wheel_speed_weight: 1.0
  max_remote_command_valid_for_ms: 500
  synchronization_timeout_s: 1.0
  stall_guard:
    enabled: true
    timeout_ms: 300
    min_command_speed_m_s: 0.02
    stationary_encoder_delta_count: 0
  gripper:
    enabled: true
    open_left_angle_deg: 0
    open_right_angle_deg: 180
    closed_left_angle_deg: 80
    closed_right_angle_deg: 100
    transport_left_angle_deg: 63
    transport_right_angle_deg: 117
    full_travel_time_s: 1
    angle_sum_deg: 180.0
  odometry:
    enabled: true
    encoder_counts_per_revolution: 836
    left_wheel_radius_mm: 33.0
    right_wheel_radius_mm: 33.0
    gyro_z_sign: -1
    max_consecutive_overrun_samples: 1
  cluster_breakup:
    enabled: false

world:
  team_color: red
  static_map:
    # 沿用 runtime.example.yaml 的命题示意图启动区域，非现场测量真值。
    # 解团门禁在彩色区域外再加车体半径和安全余量；现场变化只改静态地图。
    regions:
      - region_id: field
        kind: field
        polygon_field_mm:
          - [-1500.0, -1500.0]
          - [1500.0, -1500.0]
          - [1500.0, 1500.0]
          - [-1500.0, 1500.0]
      - region_id: red-material
        kind: red_material
        polygon_field_mm: [[-300.0, 1200.0], [0.0, 1200.0], [0.0, 1500.0], [-300.0, 1500.0]]
      - region_id: red-injured
        kind: red_injured
        polygon_field_mm: [[0.0, 1200.0], [300.0, 1200.0], [300.0, 1500.0], [0.0, 1500.0]]
      - region_id: blue-injured
        kind: blue_injured
        polygon_field_mm: [[-300.0, -1500.0], [0.0, -1500.0], [0.0, -1200.0], [-300.0, -1200.0]]
      - region_id: blue-material
        kind: blue_material
        polygon_field_mm: [[0.0, -1500.0], [300.0, -1500.0], [300.0, -1200.0], [0.0, -1200.0]]
    safe_zone_landmarks:
      - color: red
        ground_anchor_field_mm: [0.0, 1137.0]
        near_field_corners_mm: [[-330.0, 1137.0], [330.0, 1137.0]]
        measured: true
        usable: true
      - color: blue
        ground_anchor_field_mm: [0.0, -1137.0]
        near_field_corners_mm: [[330.0, -1137.0], [-330.0, -1137.0]]
        measured: true
        usable: true

match:
  robot_footprint_radius_mm: 160.0
  safety_margin_mm: 10.0
  enabled: true
  # 启动右转角，单位 rad；角速度符号决定右转方向。
  startup_turn_angle_rad: 0.5
  startup_turn_angular_velocity_rad_s: -1.5
  startup_turn_settle_time_s: 0.1
  # 启动直行距离和速度，单位 m、m/s。
  startup_forward_distance_m: 1.5
  startup_forward_speed_m_s: 0.5
  startup_forward_settle_time_s: 0.1
  # 启动直行的左右轮速 PID；现场先调 P，I/D 通常保持 0。
  startup_straight_pid_kp_rad_s_per_m_s: 1.5
  startup_straight_pid_ki_rad_s_per_m: 0.0
  startup_straight_pid_kd_rad_s_per_m_s2: 0.0
  startup_straight_pid_integral_limit: 0.10
  startup_straight_pid_deadband_m_s: 0.012
  startup_straight_pid_max_angular_velocity_rad_s: 0.08
  # 目标团搜索原地转速和单方向扫描跨度，单位 rad/s、rad。
  cluster_search_angular_velocity_rad_s: -0.2
  # 当前帧只有蓝色/未知目标或没有任务目标时使用的同向快速扫描角速度。
  cluster_search_empty_angular_velocity_rad_s: -0.6
  cluster_search_sweep_angle_rad: 6.283185307179586
  cluster_min_detections: 2
  cluster_group_ground_mm: 100.0
  # 目标团最前方物块到夹爪的解团前停车距离，单位 mm；接近速度单位 m/s。
  cluster_breakup_standoff_mm: 260.0
  cluster_approach_speed_m_s: 0.3
  # 团对准角度和丢帧保持门限；保持时间单位 ms。
  cluster_align_tolerance_rad: 0.05
  # 解团对准时短暂丢失当前团观测只零速等待，不沿旧中心继续旋转；等待窗口 2 s。
  cluster_align_hold_ms: 2000.0
  cluster_align_kp_rad_s: 0.5
  cluster_align_max_angular_velocity_rad_s: 0.35
  # 搜索目标团时启用机会抓取；首轮单绿，一般阶段优先多物资组，先停车取 10 帧均值。
  opportunistic_single_green_enabled: true
  # 保留为旧纯逻辑夹具的邻域诊断参数；正式单绿机会使用固定 TRANSPORT 走廊判定。
  opportunistic_single_green_clearance_mm: 120.0
  # 解团前推/后退的距离和速度，单位 m、m/s。
  breakup_forward_distance_m: 0.4
  breakup_forward_speed_m_s: 0.4
  breakup_backward_distance_m: 0.4
  breakup_backward_speed_m_s: 0.3
  # 解团阶段临时单轮最大加速度，单位 m/s²；null 继承 motion 全局值，按实车单独调节。
  breakup_max_wheel_acceleration_m_s2: 4.0
  # 合爪后原地扫描一整圈，单位 rad/s、rad。
  close_gripper_spin_angular_velocity_rad_s: -0.4
  spin_angle_rad: 6.283185307179586
  # 解团后绿色目标对齐接近走廊的横向阻挡半宽，单位 mm；正式远场搜索仍按
  # motion.gripper.transport_* 的固定包络评估走廊，但实际夹爪保持 CLOSED。
  green_path_half_width_mm: 50.0
  # 绿色目标允许的最大观测年龄，单位 ms。
  green_max_age_ms: 1000.0
  # 绿色目标对准阶段的失鲜保持窗口，单位 ms。
  green_align_hold_ms: 1500.0
  # 绿色目标横向对准容差，单位 mm；其余对准参数单位为 rad/s。
  # 绿色目标横向精对准的进入允许范围，单位 mm。
  green_alignment_tolerance_mm: 20.0
  green_alignment_kp_rad_s: 0.5
  green_alignment_max_angular_velocity_rad_s: 0.20
  # 绿色目标及近场组精对准的单轮最低速度；普通动作继续使用 motion 下限。
  green_alignment_min_wheel_velocity_m_s: 0.01
  # 精对准的滞回、最长持续时间和进入允许范围所需的新鲜观测帧数。
  green_alignment_hysteresis_mm: 5.0
  green_alignment_timeout_ms: 4000.0
  green_alignment_stable_frames: 3
  green_approach_speed_m_s: 0.15
  # 安全区扫描/地标搜索原地转速，单位 rad/s。
  transport_rotate_angular_velocity_rad_s: 0.5
  # d1 原地搜索安全区关键点的较快角速度；先让 bbox 完整离开图像边缘再停稳取样。
  safe_zone_key_search_angular_velocity_rad_s: 0.8
  safe_zone_bbox_edge_margin_px: 12.0
  transport_align_tolerance_mm: 30.0
  # 夹取后→d1 的推进速度，单位 m/s。
  safe_zone_grab_to_d1_speed_m_s: 0.3
  # d1→d2 的推进速度，单位 m/s。
  safe_zone_d1_to_d2_speed_m_s: 0.3
  # d2 张爪、转向、闭爪后到安全区末端的推进速度，单位 m/s。
  safe_zone_d2_to_final_speed_m_s: 0.4
  # 单橙色伤员 d2→安全区末端的独立速度，单位 m/s；当前先与通用末段一致，按实测单独调节。
  safe_zone_orange_d2_to_final_speed_m_s: 0.45
  # d2 闭爪推进后末段的固定刹车过冲提前量，正值沿己方安全区方向在终点前停车，单位 mm。
  safe_zone_d2_to_final_braking_overrun_mm: 70.0
  # 单橙色伤员 d2→安全区末端的独立刹车过冲提前量，单位 mm；当前先与通用末段一致。
  safe_zone_orange_d2_to_final_braking_overrun_mm: 80.0
  # d2→安全区末端的临时单轮最大加速度，单位 m/s²；允许独立高于 motion 全局基准，
  # 现场按刹车距离实测调整。
  safe_zone_d2_to_final_max_wheel_acceleration_m_s2: 4.0
  # 安全区路线推进终点 FieldPoint：[x_mm, y_mm]；同时定义 d1/d2 基准坐标。
  # 绿/黑物资区与橙色伤员区的独立运输终点，单位 mm。
  safe_zone_fallback_target_field_mm: [-135.0, 1115.0]
  safe_zone_injured_target_field_mm: [135.0, 1115.0]
  # 安全区路线航向保持参数；角度单位 rad，角速度单位 rad/s。
  safe_zone_fallback_heading_tolerance_rad: 0.02
  safe_zone_fallback_heading_kp_rad_s: 1.0
  safe_zone_fallback_max_angular_velocity_rad_s: 0.8
  # 闭爪状态开始 K0/K1/K2 视觉校正前的 y 偏移 d1，单位 mm。
  safe_zone_calibration_start_offset_mm: 700.0
  # 视觉校正后到 d2 点的 y 偏移，单位 mm；d2 后张爪、转向、闭爪推进，末端停稳后再次张爪。
  safe_zone_open_offset_mm: 300.0
  # 夹取后→d1、d1→d2 直线段软刹车后的场地坐标过冲分量，单位 mm；有符号。
  # 正值表示刹车后仍向 FieldPoint 的 +x/+y 方向移动，策略会将对应停车目标
  # 向负方向提前。
  safe_zone_d2_braking_overrun_x_mm: 20.0
  safe_zone_d2_braking_overrun_y_mm: 0.0
  # d1 处和 90° 校准后均要求左右轮速低于阈值并连续确认后再继续。
  safe_zone_calibration_stop_speed_threshold_m_s: 0.02
  safe_zone_calibration_stop_confirm_time_s: 0.3
  # 到达末段终点后停稳并倒车退出的距离，单位 m。
  safe_zone_exit_distance_m: 0.5
  # 解团前停车后的稳定等待时间，单位 s。
  breakup_settle_time_s: 0.1
  # 每个转向/直行动作切换前保持零速，避免加速度限制下残余运动串入下一动作。
  action_settle_time_s: 0.1
  # 地图物理边界为 ±1500 mm；夹爪偏移 200 mm 后，解团中点允许范围为 ±1300 mm。
  breakup_field_half_extent_mm: 1500.0
  breakup_gripper_offset_mm: 200.0
  # 每轮交付次数；达到后结束流程。
  required_transports: 16
  # 退出安全区后的倒车速度，单位 m/s。
  return_backup_speed_m_s: 0.3

localization:
  enabled: false
  fusion:
    enabled: false
    initial_pose:
      x_mm: 1350.0
      y_mm: 1350.0
      heading_deg: -90.0
      position_uncertainty_mm: 50.0
      heading_uncertainty_deg: 5.0
      confidence: 0.8

hailo:
  enabled: true
  hef_path: ../../hailo-models/simreal_v1/rpi_bundle/model.hef
  postprocess_onnx_path: ../../hailo-models/simreal_v1/rpi_bundle/postprocess.onnx
  output_mapping_path: ../../hailo-models/simreal_v1/rpi_bundle/onnx_split_config.json
  raw_classes:
    - green_supply
    - black_core
    - orange_injured
    - blue_danger
    - center_cross
    - safe_zone
  backend_score_threshold: 0.01
  max_detections: 100

# 复用现有车体包络/安全余量配置，供解团/夹取接近的双方安全区路径检查。

# 正式流程与独立入口共用的近场收拢；以下几何余量与实物收拢效果未验证。
near_field_grasp:
  # 一次最多纳入的物资数量；比赛规则上限为 3。
  max_targets: 3
  # 参与组合枚举的最近候选数量；其余检测仍用于障碍/顺带纳入检查，范围 3..20。
  max_candidates: 12
  # 目标 K0 到车体原点的最大近场径向距离，单位 mm。
  max_range_mm: 450.0
  # 已锁定候选的退出半径为 max_range_mm + 此滞回，避免 450 mm 边界抖动换组。
  range_hysteresis_mm: 50.0
  # 单次收拢允许的底盘最大前进行程，单位 mm。
  max_forward_distance_mm: 450.0
  # 绿/黑组前进结束时，最远目标 K0 希望保留在机器人前方的距离，单位 mm。
  target_final_x_mm: 135.0
  # 单个橙色目标按最近端加半个纵向跨度计算，终点参考距离，单位 mm。
  orange_target_final_x_mm: 210.0
  # 夹爪前端参考线；危险目标 K0 从此处到扫掠终点才参与走廊门禁，单位 mm。
  corridor_start_x_mm: 60.0
  # 夹爪开口两侧的走廊安全余量，单位 mm。
  corridor_lateral_margin_mm: 1.0
  # 非橙计划的蓝色侧邻、以及单橙计划的蓝/橙侧邻使用预测抓取方向下
  # K0 中心差，单位 mm；仅纵向基本齐平且横向紧邻时拒绝候选。
  # 明显前后错开的目标不触发；橙色半径隔离只约束单橙计划。
  side_neighbor_longitudinal_margin_mm: 60.0
  side_neighbor_lateral_margin_mm: 90.0
  # 组合开口在目标包络之外预留的总宽度，单位 mm。
  clearance_mm: 4.0
  # 组合横向中心的进入允许范围，单位 mm；不超过该值时不继续旋转对准。
  center_tolerance_mm: 20.0
  # 对准允许范围的滞回和近场对准/确认总预算，单位 ms。
  alignment_hysteresis_mm: 10.0
  alignment_timeout_ms: 6000.0
  # 只有不超过此年龄的准备结果才允许提交开爪，单位 ms。
  grasp_commit_max_observation_age_ms: 150.0
  # 实测轮编码器不变且IMU角速度低于此值，才积累静止证据。
  stationary_max_gyro_rad_s: 0.03
  # 唯一近场确认窗口需要的不同有效感知帧数。
  confirmation_frames: 3
  # 进入该角度范围后取消单轮最小速度抬升，单位 rad。
  fine_alignment_zone_rad: 0.08
  fine_alignment_min_wheel_velocity_m_s: 0.0
  # 橙色伤员中心周围的独立性禁入半径，单位 mm。
  orange_isolation_radius_mm: 100.0
  # 颜色掩码至少需要的前景像素数；不足时视为无有效地面包络。
  min_mask_pixels: 1
  # 单帧未知/质量异常后，连续稳定为绿/黑多少帧才重新允许入组。
  supply_recovery_frames: 3
  # 净空评分归一化的参考长度，单位 mm；100 mm 对应评分 1.0。
  clearance_scale_mm: 100.0
  # 初赛规则分值；候选先按总分排序。
  green_score_points: 5.0
  black_score_points: 10.0
  orange_score_points: 15.0
  # 同分方案中严格优先单橙；其权重大于其余次级权重之和。
  orange_priority_weight: 0.55
  # 同规则分值、同单橙优先级下的成员数量权重。
  count_weight: 0.10
  # 选组评分中净空的权重；特征为扣除余量后的最小净空 / clearance_scale_mm。
  clearance_weight: 0.15
  # 选组评分中前进行程的权重；行程越短得分越高。
  distance_weight: 0.12
  # 选组评分中对准转角的权重；所需转角越小得分越高。
  alignment_weight: 0.08

green_grab:
  # 无地面标定时识别单个绿色物资、开夹爪像素居中接近并合爪的简化试验；
  # 依赖 hailo.enabled 的 v3 模型，不是完整比赛入口。
  enabled: true
  # 原地搜索角速度，单位 rad/s；左转为正、右转为负，符号即方向。
  search_angular_velocity_rad_s: 0.30
  approach_speed_m_s: 0.08
  # 目标水平中心相对半幅图像的比例误差门限，及居中控制增益与角速度上限。
  align_tolerance_ratio: 0.06
  align_kp_rad_s: 1.2
  align_max_angular_velocity_rad_s: 0.35
  # 目标框下边进入该图像高度比例即视为足够接近，停车合爪。
  engage_bottom_fraction: 0.85
  # 连续看到绿色才确认并打开夹爪的帧数。
  confirm_frames: 3
  target_loss_timeout_ms: 500.0
