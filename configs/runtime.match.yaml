# 正式流程：首轮搜索最近单绿；其走廊不安全时直接解团；一般阶段按不同 X 终点优先寻找可抓取物资组。
# 本文件以启动区域 2（地图右上角、红方）为坐标基准；区域 3 通过
# rescue-vision-match 的 --start-area 3 在运行时做中心对称并切换为蓝方。

camera:
  backend: rpicam_vid
  image_size: [2304, 1296]
  fps: 20
  lens_position: 0.9687536954879761

geometry:
  intrinsics_enabled: true
  intrinsics_path: ../src/rescue_vision/calibration/output/intrinsics_20260723_154106/selected_calibration.json
  ground_mapping_enabled: true
  ground_mapping_path: ../src/rescue_vision/calibration/output/ground_mapping_debug_near_field_20260913_051955_057190/ground_mapping_debug_near_field.json

processing:
  max_observation_age_ms: 800.0

perception:
  # 夹爪内侧颜色仅用于误夹恢复；归一化去畸变图 (u,v)，排除夹臂和车体。
  gripper_color:
    enabled: true
    polygon_normalized: [[0.47, 0.85], [0.53, 0.85], [0.57, 0.97], [0.43, 0.97]]
    min_component_fraction: 0.03
    # 黑色先去除细于 ROI 短边此比例的线条，再检查实体色块面积。
    black_min_thickness_fraction: 0.12
    # 暗面仍按配置 H/S 识别彩色，防止暗绿被 V<70 的黑色范围覆盖。
    shadow_min_value: 30
    # 双橙误夹候选框内，橙色 HSV 掩码至少占整个 bbox 的比例。
    orange_bbox_min_color_fraction: 0.15
    # 通过颜色占比后，再要求 bbox 明显分离且 K0 距离足够大。
    orange_distinct_max_bbox_iou: 0.20
    orange_distinct_min_k0_distance_px: 20.0
  safe_zone_color:
    enabled: true
    red_hsv_ranges:
      - lower: [0, 100, 35]
        upper: [10, 255, 255]
      - lower: [170, 100, 35]
        upper: [179, 255, 255]
    blue_hsv_ranges:
      - lower: [90, 70, 35]
        upper: [120, 255, 255]
    min_fraction: 0.08
    min_margin: 0.03

uart:
  enabled: true
  device: /dev/serial0
  read_timeout_ms: 100.0
  write_timeout_ms: 100.0
  receive_queue_capacity: 256

remote:
  enabled: false
  role: server
  host: 0.0.0.0
  port: 8765
  access_mode: observe_only

motion:
  enabled: true
  wheel_track_m: 0.235
  max_linear_velocity_m_s: 1.5
  max_angular_velocity_rad_s: 3
  max_wheel_velocity_m_s: 1.5
  max_linear_acceleration_m_s2: 6
  max_linear_deceleration_m_s2: 6
  max_angular_acceleration_rad_s2: 34
  max_angular_deceleration_rad_s2: 50
  # 减速电机的非零单轮最低目标速度；低于该值的轮速会提升到该值。
  min_wheel_velocity_m_s: 0.01
  left_wheel_speed_weight: 1.0
  right_wheel_speed_weight: 1.0
  max_remote_command_valid_for_ms: 500
  synchronization_timeout_s: 1.0
  stall_guard:
    enabled: true
    timeout_ms: 300
    min_command_speed_m_s: 0.02
    stationary_encoder_delta_count: 0
  gripper:
    enabled: true
    open_left_angle_deg: 0
    open_right_angle_deg: 180
    closed_left_angle_deg: 80
    closed_right_angle_deg: 100
    transport_left_angle_deg: 63
    transport_right_angle_deg: 117
    full_travel_time_s: 0.1
    angle_sum_deg: 180.0
  odometry:
    enabled: true
    encoder_counts_per_revolution: 60000
    left_wheel_radius_mm: 33.0
    right_wheel_radius_mm: 33.0
    gyro_z_sign: -1
    max_consecutive_overrun_samples: 1
  cluster_breakup:
    enabled: false

world:
  team_color: red
  static_map:
    # 沿用 runtime.example.yaml 的命题示意图启动区域，非现场测量真值。
    # 解团门禁在彩色区域外再加车体半径和安全余量；现场变化只改静态地图。
    regions:
      - region_id: field
        kind: field
        polygon_field_mm:
          - [-1500.0, -1500.0]
          - [1500.0, -1500.0]
          - [1500.0, 1500.0]
          - [-1500.0, 1500.0]
      - region_id: red-material
        kind: red_material
        polygon_field_mm: [[-300.0, 1200.0], [0.0, 1200.0], [0.0, 1500.0], [-300.0, 1500.0]]
      - region_id: red-injured
        kind: red_injured
        polygon_field_mm: [[0.0, 1200.0], [300.0, 1200.0], [300.0, 1500.0], [0.0, 1500.0]]
      - region_id: blue-injured
        kind: blue_injured
        polygon_field_mm: [[-300.0, -1500.0], [0.0, -1500.0], [0.0, -1200.0], [-300.0, -1200.0]]
      - region_id: blue-material
        kind: blue_material
        polygon_field_mm: [[0.0, -1500.0], [300.0, -1500.0], [300.0, -1200.0], [0.0, -1200.0]]
    safe_zone_landmarks:
      - color: red
        ground_anchor_field_mm: [0.0, 1137.0]
        near_field_corners_mm: [[-330.0, 1137.0], [330.0, 1137.0]]
        measured: true
        usable: true
      - color: blue
        ground_anchor_field_mm: [0.0, -1137.0]
        near_field_corners_mm: [[330.0, -1137.0], [-330.0, -1137.0]]
        measured: true
        usable: true

match:
  # 实验性门前清障：关闭后恢复普通运输；区域沿用 world.static_map。
  gate_clearance:
    enabled: true
    front_depth_mm: 200.0
    side_x_mm: 350.0
    sweep_y_mm: 1115.0
    center_release_y_mm: 650.0
    release_reverse_m: 0.12
    sweep_speed_m_s: 1.0
    transit_speed_m_s: 0.5
    reacquire_radius_mm: 180.0
    observation_timeout_ms: 1400.0
    attempt_timeout_s: 30.0
  robot_footprint_radius_mm: 160.0
  safety_margin_mm: 10.0
  enabled: true
  # 启动右转角，单位 rad；角速度符号决定右转方向。
  startup_turn_angle_rad: 0.75
  startup_turn_angular_velocity_rad_s: -2.0
  startup_turn_settle_time_s: 0.2
  # 启动直行距离和速度，单位 m、m/s。
  startup_forward_distance_m: 2.1
  startup_forward_speed_m_s: 1.5
  startup_forward_settle_time_s: 0.1
  # 启动直行的左右轮速 PID；现场先调 P，I/D 通常保持 0。
  startup_straight_pid_kp_rad_s_per_m_s: 1
  startup_straight_pid_ki_rad_s_per_m: 0.0
  startup_straight_pid_kd_rad_s_per_m_s2: 0.0
  startup_straight_pid_integral_limit: 0.10
  startup_straight_pid_deadband_m_s: 0.012
  startup_straight_pid_max_angular_velocity_rad_s: 0.08
  # 目标团搜索原地转速和单方向扫描跨度，单位 rad/s、rad。
  cluster_search_angular_velocity_rad_s: -1
  # 当前帧只有蓝色或没有任务目标时使用的同向快速扫描角速度。
  cluster_search_empty_angular_velocity_rad_s: -2
  # 一次决策的旋转预算，单位 rad。搜索、对准、近场和重选之间连续累计绝对
  # 转角，只有真正执行完一次抓取或一次解团推挤、或确认场上不再有蓝块以外
  # 的可收集信息时才重新计时。整整一圈用完仍未执行任何动作时必须推进：
  # 先选其它未被失败记忆挡住的合法计划；没有合法计划时执行经过路径检查的
  # 有界 cluster_relocate 换位。原地转向或新会话不会清除失败记忆。
  cluster_search_sweep_angle_rad: 6.283185307179586
  cluster_min_detections: 2
  # 成团的地面中心距上限，单位 mm。按物体的半对角接触上界加地面拟合中心
  # 不确定度（perception.target_ground_geometry.fitting.max_center_uncertainty_mm
  # 为 12 mm/个，两两合计 +24 mm）换算：物资/危险块角对角 56.6、伤员与方块
  # 73.0、黑核与方块 51.4，加不确定度后最高 97 mm，100 mm 覆盖全部常见接触
  # 组合。再放大到 115 mm 只能多并进"两个伤员角对角"，同时会把 100～120 mm
  # 的散件（实测最近邻分布里占 5%）也判成团，反过来要求推移无关目标；
  # 伤员本来就单独转运。保持 100 mm。
  cluster_group_ground_mm: 100.0
  # 旧/CC 入口的目标团接近参数；正式动态解团停稳后直接使用当前帧，不单独接近。
  cluster_breakup_standoff_mm: 260.0
  cluster_approach_speed_m_s: 0.3
  # 旧/CC 入口的团对准角度和丢帧保持门限；保持时间单位 ms。
  cluster_align_tolerance_rad: 0.05
  # 动态解团确认窗口上限，单位 ms；正式流程不再使用单独的对准/接近阶段。
  cluster_align_hold_ms: 2000.0
  # 对准比例增益翻倍；仍受下方角速度上限约束。
  cluster_align_kp_rad_s: 1.0
  cluster_align_max_angular_velocity_rad_s: 0.4
  # 搜索目标团时启用机会抓取；首轮单绿，一般阶段优先多物资组。
  opportunistic_single_green_enabled: true
  # 保留为旧纯逻辑夹具的邻域诊断参数；正式单绿机会使用固定 TRANSPORT 走廊判定。
  opportunistic_single_green_clearance_mm: 120.0
  # 解团前推/后退的距离和速度，单位 m、m/s。
  # match: 闭爪定距前进 0.5 m、后退 0.3 m，整段路径不可行时拒绝该计划。
  # 最小推进门槛，单位 mm。门槛取 `breakup_min_penetration_mm +
  # breakup_braking_margin_mm` 与局部接触集自身纵向跨度的较小值：浅团只要能
  # 整段推穿就成立。40 mm 正四面体黑核的内切接触盘只有 2r≈23 mm，固定门槛
  # 30 mm 会让它永远选不出瞄准点（现场日志里 129 次逐候选淘汰有 127 次是
  # 23.1 mm）。行程不足以推穿接触跨度时仍按当时门槛淘汰。
  breakup_min_penetration_mm: 10.0
  breakup_retreat_clearance_mm: 40.0
  breakup_push_margin_mm: 60.0
  breakup_braking_margin_mm: 20.0
  breakup_deceleration_m_s2: 0.8
  # 同一个物理瞄准点（场地点，容差 cluster_group_ground_mm）最多尝试次数；
  # 用尽后换下一个瞄准点或下一个团，不再连坐整片区域。
  breakup_max_attempts: 3
  # 停稳后当前接触核心需要的连续有效帧数；不再执行接近后第二轮复核。
  breakup_confirmation_frames: 1
  # 停稳后仍选不出任何合法接触计划时的重观测窗口，单位 ms。重复观测只有在
  # 新一帧检出新的可接触成员时才可能改变结果，所以只等一到两帧就退出本次
  # 区域，不占满上面的确认帧预算（现场感知 250～430 ms，取约两帧）。
  breakup_no_plan_reobserve_ms: 300
  # 误夹释放后锁定原团短解团；速度/制动继承 breakup，航向只允许微调。
  misgrasp_breakup_forward_distance_m: 0.30
  misgrasp_breakup_backward_distance_m: 0.08
  misgrasp_breakup_max_heading_change_rad: 0.17453292519943295
  breakup_forward_distance_m: 0.4
  breakup_forward_speed_m_s: 1.0
  breakup_backward_distance_m: 0.10
  breakup_backward_speed_m_s: 1.5
  # 解团阶段临时车体加减速度；null 分别继承 motion 对应全局值。
  breakup_max_linear_acceleration_m_s2: 4.0
  breakup_max_linear_deceleration_m_s2: 4.0
  breakup_max_angular_acceleration_rad_s2: 34.0425531915
  breakup_max_angular_deceleration_rad_s2: 34.0425531915
  # 合爪后的补夹扫描：有可补夹信息时按 close_gripper_spin_angular_velocity_rad_s
  # 转动，当前帧只有蓝色或已收拢/已交付物资时改用
  # cluster_search_empty_angular_velocity_rad_s 快速转动；两条速度共用
  # spin_angle_rad 作为本次扫描的旋转预算（原 2*pi，现改为 270 度），单位
  # rad/s、rad。扫描命中即进入全局对准链，完成一次补夹后直接返程。
  close_gripper_spin_angular_velocity_rad_s: -1
  spin_angle_rad: 4.712388980384690
  # 走廊横向阻挡门限的回退半宽，单位 mm。正式远场搜索按两块实体的内切
  # 半径之和加近场夹爪余量（clearance_mm/2 + corridor_lateral_margin_mm）
  # 逐目标计算门限，不再用固定半宽，也不再用蓝块外接半径；只有缺少目标
  # 物理尺寸配置的纯逻辑调用方才使用本回退值。
  green_path_half_width_mm: 50.0
  # 绿色目标允许的最大观测年龄，单位 ms。
  green_max_age_ms: 1000.0
  # 绿色目标对准阶段的失鲜保持窗口，单位 ms。
  green_align_hold_ms: 1500.0
  # 绿色目标横向对准容差，单位 mm；其余对准参数单位为 rad/s。
  # 只要求粗对准：目标大致对中间即可，剩余横向偏差由近场停稳后的
  # 左右边界不对称开爪吸收，不再追精对准。
  green_alignment_tolerance_mm: 40.0
  # 远场及近场共用：比例增益翻倍，保留接近对准时的递减曲线。
  green_alignment_kp_rad_s: 2.0
  green_alignment_max_angular_velocity_rad_s: 0.6
  # 远场绿色目标对准的单轮最低速度；近场旋转使用 motion 下限。
  green_alignment_min_wheel_velocity_m_s: 0.01
  # 对准的滞回、最长持续时间和进入允许范围所需的新鲜观测帧数。
  # 滞回加宽到接近容差，避免在带边反复进出导致的来回摆。
  green_alignment_hysteresis_mm: 20.0
  green_alignment_timeout_ms: 3000.0
  # 单帧达带即进入接近，识别到目标后不再等待多帧确认。
  green_alignment_stable_frames: 1
  # 仅抓取接近和夹取后→d1中段提速；d1→d2与最终投递严格使用各自配置速度。
  pickup_cruise_speed_scale: 1.5
  # 抓取精细接近最后 50 mm 的比例速度增益，单位 s^-1；速度约为增益乘剩余距离。
  pickup_terminal_speed_gain_s_inv: 2.0
  green_approach_speed_m_s: 0.4
  # 安全区扫描/地标搜索原地转速，单位 rad/s。
  transport_rotate_angular_velocity_rad_s: 3
  # d1 无 bbox 时搜索角速度；两点可靠时直接停稳校准。
  safe_zone_key_search_angular_velocity_rad_s: 0.8
  # 单侧裁剪时一次调整角度和速度，不追框居中。
  safe_zone_bbox_turn_max_angular_velocity_rad_s: 0.25
  safe_zone_bbox_edge_margin_px: 12.0
  # 采样阶段丢点时保持静止等待新帧的最长时间，单位 s；
  # 2026-09-18 实车关键点在旧 0.8 s 窗口后恢复，因此增加 2 s 后再降级到航位推算。
  safe_zone_keypoint_reobserve_timeout_s: 1.2
  # 两侧或上下裁剪且缺所选两点时，一次倒车调整；单位分别为 m/s、m。
  safe_zone_keypoint_reverse_speed_m_s: 0.1
  safe_zone_keypoint_reverse_max_distance_m: 0.10
  transport_align_tolerance_mm: 30.0
  # 夹取后→d1 的推进速度，单位 m/s。
  safe_zone_grab_to_d1_speed_m_s: 1.0
  # d1→d2 的推进速度，单位 m/s。
  safe_zone_d1_to_d2_speed_m_s: 0.5
  # d2 张爪、转向、闭爪后到安全区末端的推进速度，单位 m/s。
  safe_zone_d2_to_final_speed_m_s: 0.35
  # 单橙色伤员 d2→安全区末端的独立速度，单位 m/s；当前先与通用末段一致，按实测单独调节。
  safe_zone_orange_d2_to_final_speed_m_s: 0.35
  # d2 闭爪推进后末段的固定刹车过冲提前量，正值沿己方安全区方向在终点前停车，单位 mm。
  safe_zone_d2_to_final_braking_overrun_mm: 30
  # 单橙色伤员 d2→安全区末端的独立刹车过冲提前量，单位 mm；当前先与通用末段一致。
  safe_zone_orange_d2_to_final_braking_overrun_mm: 50.0
  # d2→安全区末端的临时车体加减速度；允许独立高于 motion 全局基准。
  # 现场按加速响应、刹车距离和转向响应分别实测调整。
  safe_zone_d2_to_final_max_linear_acceleration_m_s2: 4.0
  safe_zone_d2_to_final_max_linear_deceleration_m_s2: 4.0
  safe_zone_d2_to_final_max_angular_acceleration_rad_s2: 34.0425531915
  safe_zone_d2_to_final_max_angular_deceleration_rad_s2: 34.0425531915
  # 安全区路线推进终点 FieldPoint：[x_mm, y_mm]；同时定义 d1/d2 基准坐标。
  # 绿/黑物资区与橙色伤员区的独立运输终点，单位 mm。
  safe_zone_fallback_target_field_mm: [-130.0, 1115.0]
  safe_zone_injured_target_field_mm: [170.0, 1115.0]
  # 安全区路线航向保持参数；角度单位 rad，角速度单位 rad/s。
  safe_zone_fallback_heading_tolerance_rad: 0.02
  safe_zone_fallback_heading_kp_rad_s: 1.0
  safe_zone_fallback_max_angular_velocity_rad_s: 1.0
  # D1 视觉校正距安全区终点的最小/最大偏移，单位 mm。
  # 落在区间内可原地校准；更靠近安全区时先返回最小偏移线。
  safe_zone_calibration_min_offset_mm: 400.0
  safe_zone_calibration_start_offset_mm: 700.0
  # 视觉校正后到 d2 点的 y 偏移，单位 mm；d2 后张爪、转向、闭爪推进，末端停稳后再次张爪。
  safe_zone_open_offset_mm: 300.0
  # 夹取后→d1、d1→d2 直线段软刹车后的场地坐标过冲分量，单位 mm；有符号。
  # 正值表示刹车后仍向 FieldPoint 的 +x/+y 方向移动，策略会将对应停车目标
  # 向负方向提前。
  # d1 处和 90° 校准后均要求左右轮速低于阈值并连续确认后再继续。
  safe_zone_calibration_stop_speed_threshold_m_s: 0.02
  safe_zone_calibration_stop_confirm_time_s: 0.05
  # 到达末段终点后停稳并倒车退出的距离，单位 m。
  safe_zone_exit_distance_m: 0.8
  # 解团前停车后的稳定等待时间，单位 s。
  breakup_settle_time_s: 0.05
  # 每个转向/直行动作切换前保持零速，避免加速度限制下残余运动串入下一动作。
  action_settle_time_s: 0.05
  # 地图物理边界为 ±1500 mm；夹爪偏移 200 mm 后，解团中点允许范围为 ±1300 mm。
  breakup_field_half_extent_mm: 1500.0
  breakup_gripper_offset_mm: 200.0
  # 每轮交付次数；达到后结束流程。
  required_transports: 16
  # 退出安全区后的倒车速度，单位 m/s。
  return_backup_speed_m_s: 1.5

localization:
  # 与感知快照年龄门一致，静止采集仍由编码器/IMU验证。
  safe_zone_corners:
    max_observation_age_ms: 800.0
  enabled: false
  fusion:
    enabled: false
    initial_pose:
      x_mm: 1350.0
      y_mm: 1350.0
      heading_deg: -90.0
      position_uncertainty_mm: 50.0
      heading_uncertainty_deg: 5.0
      confidence: 0.8

hailo:
  enabled: true
  hef_path: ../../hailo-models/simreal_v1/rpi_bundle/model.hef
  postprocess_onnx_path: ../../hailo-models/simreal_v1/rpi_bundle/postprocess.onnx
  output_mapping_path: ../../hailo-models/simreal_v1/rpi_bundle/onnx_split_config.json
  raw_classes:
    - green_supply
    - black_core
    - orange_injured
    - blue_danger
    - center_cross
    - safe_zone
  backend_score_threshold: 0.01
  max_detections: 100

# 复用现有车体包络/安全余量配置，供解团/夹取接近的双方安全区路径检查。

# 正式流程与独立入口共用的近场收拢；以下几何余量与实物收拢效果未验证。
near_field_grasp:
  # 一次最多纳入的物资数量；比赛规则上限为 3。
  max_targets: 3
  # 参与组合枚举的最近候选数量；其余检测仍用于障碍/顺带纳入检查，范围 3..20。
  max_candidates: 12
  # 同一停车视野中新检测与已有目标 bbox 的 IoU 不超过此值时，首帧冻结为独立目标。
  stopped_scene_new_target_max_bbox_iou: 0.20
  # 目标 K0 到车体原点的最大近场径向距离，单位 mm。
  max_range_mm: 450.0
  # 已锁定候选的退出半径为 max_range_mm + 此滞回，避免 450 mm 边界抖动换组。
  range_hysteresis_mm: 50.0
  # 单次收拢允许的底盘最大前进行程，单位 mm。
  max_forward_distance_mm: 600
  # 绿/黑组前进结束时，最远目标 K0 希望保留在机器人前方的距离，单位 mm。
  target_final_x_mm: 142.0
  # 贪心补夹绿/黑组的独立终点；降低此值会让补夹前进更深，单位 mm。
  greedy_target_final_x_mm: 108.0
  # 单个橙色目标的底面 K0 终点，降低该值会增加前进行程，单位 mm。
  orange_target_final_x_mm: 108.0
  black_closed_servo_offset_deg: 5.0
  # 夹爪前端参考线；危险目标 K0 从此处到扫掠终点才参与走廊门禁，单位 mm。
  corridor_start_x_mm: 60.0
  # 夹爪开口两侧的走廊安全余量，单位 mm。
  corridor_lateral_margin_mm: 1.0
  # 非橙计划的蓝色侧邻、以及单橙计划的蓝/橙侧邻使用预测抓取方向下
  # K0 中心差，单位 mm；仅纵向基本齐平且横向紧邻时拒绝候选。
  # 明显前后错开的目标不触发；橙色半径隔离只约束单橙计划。
  side_neighbor_longitudinal_margin_mm: 40.0
  side_neighbor_lateral_margin_mm: 60.0
  # 组合开口在目标包络之外预留的总宽度，单位 mm。
  clearance_mm: 4.0
  # 保留给兼容调用方的几何参数；正式近场是否转向由左右机械可达性决定，
  # 不把该值作为包络中心提交门槛。
  center_tolerance_mm: 5.0
  # 近场停稳并用当前帧提交的总预算，单位 ms。
  # 完全选不出方案时只给一个有界感知窗口；到期必须换位、换向或进入解团，
  # 不能在同一物理区域重复零速等待。
  no_plan_wait_ms: 600.0
  # 没有新计划时最多执行一次短有界转角；超过后由 IMU/新帧复核，
  # 禁止按旧视觉角连续旋转数秒。
  alignment_continue_max_age_ms: 400.0
  alignment_hysteresis_mm: 10.0
  alignment_timeout_ms: 1200.0
  # 只有不超过此年龄的准备结果才允许提交开爪，单位 ms。
  grasp_commit_max_observation_age_ms: 150.0
  # 实测轮编码器不变且IMU角速度低于此值，才积累静止证据。
  stationary_max_gyro_rad_s: 0.03
  # 停稳后的一个当前有效帧即可提交，不再做额外中心确认。
  confirmation_frames: 1
  # 进入该角度范围后取消单轮最小速度抬升，单位 rad。
  fine_alignment_zone_rad: 0.08
  fine_alignment_min_wheel_velocity_m_s: 0.0
  # 橙色伤员中心周围的独立性禁入半径，单位 mm。
  orange_isolation_radius_mm: 10.0
  # 优先采用颜色掩码的最少前景像素数；不足时使用 bbox 底边几何。
  min_mask_pixels: 1
  # 净空评分归一化的参考长度，单位 mm；100 mm 对应评分 1.0。
  clearance_scale_mm: 100.0
  # 初赛规则分值；候选先按总分排序。
  green_score_points: 5.0
  black_score_points: 10.0
  orange_score_points: 15.0
  # 同分方案中严格优先单橙；其权重大于其余次级权重之和。
  orange_priority_weight: 0.55
  # 同规则分值、同单橙优先级下的成员数量权重。
  count_weight: 0.10
  # 选组评分中净空的权重；特征为扣除余量后的最小净空 / clearance_scale_mm。
  clearance_weight: 0.15
  # 选组评分中前进行程的权重；行程越短得分越高。
  distance_weight: 0.12
  # 选组评分中对准转角的权重；所需转角越小得分越高。
  alignment_weight: 0.08

green_grab:
  # 无地面标定时识别单个绿色物资、开夹爪像素居中接近并合爪的简化试验；
  # 依赖 hailo.enabled 的 v3 模型，不是完整比赛入口。
  enabled: true
  # 原地搜索角速度，单位 rad/s；左转为正、右转为负，符号即方向。
  search_angular_velocity_rad_s: 0.30
  approach_speed_m_s: 0.08
  # 目标水平中心相对半幅图像的比例误差门限，及居中控制增益与角速度上限。
  align_tolerance_ratio: 0.06
  align_kp_rad_s: 1.2
  align_max_angular_velocity_rad_s: 0.35
  # 目标框下边进入该图像高度比例即视为足够接近，停车合爪。
  engage_bottom_fraction: 0.80
  # 连续看到绿色才确认并打开夹爪的帧数。
  confirm_frames: 3
  target_loss_timeout_ms: 500.0
