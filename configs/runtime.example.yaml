camera:
  # picamera2 可记录逐帧曝光/增益等元数据；rpicam_vid 是低开销备选。
  backend: picamera2
  image_size: [2304, 1296]
  fps: 20
  lens_position: 1.0

geometry:
  # 正式任务数据统一保存去畸变图；填写可用内参后开启。
  intrinsics_enabled: false
  intrinsics_path: null
  # 尚未得到地面映射时保持关闭，不影响使用内参去畸变。
  ground_mapping_enabled: false
  ground_mapping_path: null

recording:
  # 队列满时丢弃记录请求，不阻塞实时视觉线程。
  queue_capacity: 8
  # 2304×1296、20 FPS 采集默认使用 JPEG 95；PNG 编码可能无法持续跟上。
  image_format: jpg

processing:
  # 超过该观测年龄时，上层必须丢弃或进入保守降级；需由实测继续收敛。
  max_observation_age_ms: 150.0

uart:
  # 本地实际设备名写入不提交的 runtime.yaml；禁用时不会导入或打开串口。
  enabled: false
  device: null
  # 当前实现仍是 115200 8N1 文本行；两端后续按专项文档切换为同波特率二进制协议。
  baudrate: 115200
  read_timeout_ms: 100.0
  write_timeout_ms: 100.0
  # UART 后台读取只写入有界队列；溢出视为通信故障，不静默丢报文。
  receive_queue_capacity: 256
  # 当前文本行的上限；切换固定长度二进制帧时将由协议解码上限替代。
  max_line_bytes: 512

remote:
  # 树莓派通常为 server；电脑调试端可使用单独 runtime.yaml 配成 client。
  enabled: false
  role: server
  host: 0.0.0.0
  port: 8765
  # 比赛运行配置必须保持 observe_only；debug_control 只用于赛外采集/调试。
  access_mode: observe_only
  # 直接连接受控现场局域网，不使用密钥或认证握手。
  connect_timeout_ms: 2000.0
  io_timeout_ms: 100.0
  # 控制消息不能静默丢弃；观察消息按 topic 合并并丢旧保新。
  control_queue_capacity: 32
  # manual-capture 同时保留视频、车辆状态和地图三个最新 topic。
  observation_queue_capacity: 3
  max_header_bytes: 4096
  # 默认容纳单帧 JPEG/地图快照；仍需按实际分辨率和网络验证。
  max_payload_bytes: 2097152

motion:
  # 未测得真实轮距前保持禁用；启用还要求 uart.enabled=true。
  enabled: false
  wheel_track_m: null
  # 以下是赛外调试的车端硬上限，远程请求超限会停车并报错，不会静默截断。
  max_linear_velocity_m_s: 0.25
  max_angular_velocity_rad_s: 1.0
  max_wheel_velocity_m_s: 0.30
  # 单轮目标速度变化率；0.5 m/s² 时从静止到 0.30 m/s 约需 0.6 秒。
  max_wheel_acceleration_m_s2: 0.50
  max_remote_command_valid_for_ms: 500
  gripper:
    # 必须先测得安全端点；每组左右角之和必须为 194°，再启用持续扳机控制。
    enabled: false
    open_left_angle_deg: null
    open_right_angle_deg: null
    closed_left_angle_deg: null
    closed_right_angle_deg: null
    full_travel_time_s: null

tracking:
  confirmation_hits: 2
  max_association_ground_mm: 250.0
  min_association_iou: 0.10
  max_coast_ms: 600.0
  confidence_decay_per_second: 0.8
  min_confidence: 0.15

world:
  max_visual_age_ms: 250.0
  opponent_max_age_ms: 500.0
  danger_confirm_threshold: 0.60
  danger_suspect_threshold: 0.15
  unknown_suspect_threshold: 0.50
  # 抽签后设为 red 或 blue；unknown 时只生成 field 语义，不把固定红蓝区
  # 猜成己方/对方区域。
  team_color: unknown
  # 固定物理地图的唯一配置权威。坐标均为 FieldPoint 毫米：中心十字为原点，
  # +x 沿水平基准线向右，+y 沿竖直基准线指向红色安全区。
  static_map:
    center_cross:
      # 该值按坐标定义必须保持 [0, 0]；不能用它补偿标定或场地误差。
      intersection_field_mm: [0.0, 0.0]
      # 四条射线的固定终端语义供定位消歧。plain_boundary 在 ±x 重复，因此
      # 单独看到普通边界仍保留 180° 歧义；红/蓝安全区任一可靠观测可定向。
      terminals:
        positive_x: plain_boundary
        negative_x: plain_boundary
        positive_y: red_safe_zone
        negative_y: blue_safe_zone
    # 以下 3000 mm 场界、600×300 mm 安全区和 300 mm 出发区来自命题示意图，
    # 是启动地图而非现场测量真值；现场尺寸或布置变化时只改这里。
    # 安全区多边形描述彩色有效区域，不包含外侧 660 mm 围栏厚度。
    regions:
      - region_id: field
        kind: field
        polygon_field_mm:
          - [-1500.0, -1500.0]
          - [1500.0, -1500.0]
          - [1500.0, 1500.0]
          - [-1500.0, 1500.0]
      - region_id: red-material
        kind: red_material
        polygon_field_mm:
          - [-300.0, 1200.0]
          - [0.0, 1200.0]
          - [0.0, 1500.0]
          - [-300.0, 1500.0]
      - region_id: red-injured
        kind: red_injured
        polygon_field_mm:
          - [0.0, 1200.0]
          - [300.0, 1200.0]
          - [300.0, 1500.0]
          - [0.0, 1500.0]
      - region_id: blue-injured
        kind: blue_injured
        polygon_field_mm:
          - [-300.0, -1500.0]
          - [0.0, -1500.0]
          - [0.0, -1200.0]
          - [-300.0, -1200.0]
      - region_id: blue-material
        kind: blue_material
        polygon_field_mm:
          - [0.0, -1500.0]
          - [300.0, -1500.0]
          - [300.0, -1200.0]
          - [0.0, -1200.0]
      # 四个出发区共用 start_zone kind，以稳定 region_id 区分编号。
      - region_id: start-1
        kind: start_zone
        polygon_field_mm:
          - [-1500.0, 1200.0]
          - [-1200.0, 1200.0]
          - [-1200.0, 1500.0]
          - [-1500.0, 1500.0]
      - region_id: start-2
        kind: start_zone
        polygon_field_mm:
          - [1200.0, 1200.0]
          - [1500.0, 1200.0]
          - [1500.0, 1500.0]
          - [1200.0, 1500.0]
      - region_id: start-3
        kind: start_zone
        polygon_field_mm:
          - [-1500.0, -1500.0]
          - [-1200.0, -1500.0]
          - [-1200.0, -1200.0]
          - [-1500.0, -1200.0]
      - region_id: start-4
        kind: start_zone
        polygon_field_mm:
          - [1200.0, -1500.0]
          - [1500.0, -1500.0]
          - [1500.0, -1200.0]
          - [1200.0, -1200.0]

mission:
  match_duration_s: 180.0
  no_motion_timeout_s: 15.0
  opponent_contact_timeout_s: 10.0
  danger_avoid_distance_mm: 500.0
  target_priority: [orange_injured, black_core, green_supply]

perception:
  # 模型负责检测框和 K0；最终任务类别由框内 HSV 颜色证据决定。
  detection_threshold: 0.25
  k0_threshold: 0.50
  color_classifier:
    # OpenCV HSV：H=0..179，S/V=0..255。初值来自命题文件示意图，
    # 不是官方色卡；必须按现场实物、光照和相机参数重新校准。
    ranges:
      green_supply:
        - lower: [35, 70, 71]
          upper: [84, 255, 255]
      black_core:
        - lower: [0, 0, 0]
          upper: [179, 255, 70]
      orange_injured:
        - lower: [0, 90, 80]
          upper: [20, 255, 255]
        - lower: [170, 90, 80]
          upper: [179, 255, 255]
      blue_danger:
        - lower: [85, 50, 71]
          upper: [110, 255, 255]
    min_color_fraction: 0.15
    min_color_dominance: 0.70
    min_dominance_margin: 0.20
    morphology_kernel_size: 3
    open_iterations: 1
    close_iterations: 1
    min_component_area_fraction: 0.002
  target_ground_geometry:
    # 依赖带完整相机外参的地面标定。现场轮廓与性能验证前保持关闭。
    enabled: false
    objects:
      # 盒体 length 沿目标局部长轴，width 沿短轴，height 向上。
      green_supply:
        shape: box
        length_mm: 40.0
        width_mm: 40.0
        height_mm: 40.0
      # 核心物资确认为以正三角形面接地的正四面体。
      black_core:
        shape: regular_tetrahedron
        edge_mm: 40.0
      orange_injured:
        shape: box
        length_mm: 80.0
        width_mm: 40.0
        height_mm: 40.0
      blue_danger:
        shape: box
        length_mm: 40.0
        width_mm: 40.0
        height_mm: 40.0
    fitting:
      # 先在 K0 周围按已知足迹搜索，再对最优位置和朝向细化。
      coarse_center_step_mm: 5.0
      coarse_yaw_step_deg: 10.0
      refine_center_step_mm: 1.0
      refine_center_radius_mm: 6.0
      refine_top_candidates: 3
      refine_yaw_step_deg: 2.0
      refine_yaw_radius_deg: 10.0
      search_radius_margin_mm: 8.0
      silhouette_weight: 0.65
      contour_weight: 0.25
      contact_weight: 0.10
      contour_distance_scale_px: 4.0
      contact_distance_scale_px: 6.0
      max_contact_residual_px: 12.0
      ambiguity_score_delta: 0.03
      max_center_uncertainty_mm: 12.0
      min_fit_score: 0.60
      min_silhouette_iou: 0.45
  field_features:
    # 当前环境没有现场场地样本，模板保持关闭；开启前必须启用并验证地面映射。
    enabled: false
    colors:
      # 初值取自命题文件示意图而非官方色卡，只用于搭建和离线初调。
      safe_red:
        - lower: [0, 80, 80]
          upper: [12, 255, 255]
        - lower: [170, 80, 80]
          upper: [179, 255, 255]
      safe_blue:
        - lower: [90, 60, 70]
          upper: [110, 255, 255]
      start_magenta:
        - lower: [140, 80, 80]
          upper: [165, 255, 255]
      entrance_purple:
        - lower: [130, 60, 50]
          upper: [160, 255, 255]
      dark_marking:
        - lower: [0, 0, 0]
          upper: [179, 255, 80]
    morphology:
      kernel_size: 5
      open_iterations: 1
      close_iterations: 2
    region_filter:
      min_area_fraction: 0.002
      min_rectangularity: 0.55
      # 同时容纳命题图内外尺寸和制造、标定误差；现场数据到位后收紧。
      dimension_tolerance_fraction: 0.40
    safe_zone:
      entrance_color_fraction: 0.10
      divider_dark_fraction: 0.10
    center_cross:
      min_axis_span_fraction: 0.20
      max_gap_fraction: 0.06
      min_gap_count: 2
      perpendicular_tolerance_deg: 15.0
      # 真实 BEV 中中心线常呈低对比灰色连续细线；局部暗线与点划线证据并用。
      local_window_fraction: 0.015
      local_contrast_threshold: 10
      max_saturation: 80
      min_line_support_fraction: 0.10
      min_axis_balance_fraction: 0.08
      min_intersection_margin_fraction: 0.02
    boundary:
      canny_low_threshold: 50
      canny_high_threshold: 150
      min_line_length_fraction: 0.20
      corner_tolerance_deg: 20.0
      max_features: 8
      min_vertical_support_count: 3
      side_contrast_threshold: 15

  # 局部场界只依赖机器人地面系 BEV，不依赖全局定位。默认只输出三态掩膜；
  # 取得真实场边录像并验收危险类召回前，不启用推理前硬遮挡。
  field_boundary:
    enabled: false
    hard_mask_enabled: false
    min_candidate_confidence: 0.25
    min_confirmations: 2
    max_missed_frames: 1
    line_angle_tolerance_deg: 12.0
    line_distance_tolerance_mm: 120.0
    ransac_inlier_distance_mm: 60.0
    rectangle_tolerance_fraction: 0.20
    boundary_band_mm: 120.0
    segment_extension_mm: 150.0
    min_filter_confidence: 0.55
    max_mask_age_ms: 150.0
    mask_blur_radius_px: 5
    neutral_fill_bgr: [114, 114, 114]

localization:
  # 只生成中心十字低频绝对位姿观测；不包含 IMU/编码器融合。
  enabled: false
  # 从十字交点沿四条基准线射线搜索同帧安全区或场界终端。
  ray_min_forward_distance_mm: 500.0
  ray_max_forward_distance_mm: 1800.0
  ray_max_lateral_distance_mm: 120.0
  ray_angle_tolerance_deg: 10.0
  min_anchor_confidence: 0.25
  max_prior_heading_innovation_deg: 20.0
  # 无实场误差标定前只提供保守下限，不能当作已验证精度。
  position_uncertainty_floor_mm: 20.0
  heading_uncertainty_floor_deg: 3.0

hailo:
  # 模板默认禁用；实际部署值写入不提交的 configs/runtime.yaml。
  enabled: false
  hef_path: null
  postprocess_onnx_path: null
  output_mapping_path: null
  raw_classes: []
  class_mapping: {}
  backend_score_threshold: 0.01
  max_detections: 100
