schema_version: 10

camera:
  # picamera2 可记录逐帧曝光/增益等元数据；rpicam_vid 是低开销备选。
  backend: picamera2
  image_size: [2304, 1296]
  fps: 20
  lens_position: 1.0

geometry:
  # 正式任务数据统一保存去畸变图；填写可用内参后开启。
  intrinsics_enabled: false
  intrinsics_path: null
  # 尚未得到地面映射时保持关闭，不影响使用内参去畸变。
  ground_mapping_enabled: false
  ground_mapping_path: null

recording:
  # 队列满时丢弃记录请求，不阻塞实时视觉线程。
  queue_capacity: 8
  # 2304×1296、20 FPS 采集默认使用 JPEG 95；PNG 编码可能无法持续跟上。
  image_format: jpg

processing:
  # 超过该观测年龄时，上层必须丢弃或进入保守降级；需由实测继续收敛。
  max_observation_age_ms: 150.0

uart:
  # 本地实际设备名写入不提交的 runtime.yaml；禁用时不会导入或打开串口。
  enabled: false
  device: null
  # 当前 STM32 电控协议为 115200 8N1、CRLF 结尾。
  baudrate: 115200
  read_timeout_ms: 100.0
  write_timeout_ms: 100.0
  # UART 后台读取只写入有界队列；溢出视为通信故障，不静默丢报文。
  receive_queue_capacity: 256
  # 为后续同链路增加 IMU 遥测保留空间；具体报文仍由协议层定义。
  max_line_bytes: 512

remote:
  # 树莓派通常为 server；电脑调试端可使用单独 runtime.yaml 配成 client。
  enabled: false
  role: server
  host: 0.0.0.0
  port: 8765
  # 比赛运行配置必须保持 observe_only；debug_control 只用于赛外采集/调试。
  access_mode: observe_only
  # 直接连接受控现场局域网，不使用密钥或认证握手。
  connect_timeout_ms: 2000.0
  io_timeout_ms: 100.0
  # 控制消息不能静默丢弃；观察消息按 topic 合并并丢旧保新。
  control_queue_capacity: 32
  observation_queue_capacity: 2
  max_header_bytes: 4096
  # 默认容纳单帧 JPEG/地图快照；仍需按实际分辨率和网络验证。
  max_payload_bytes: 2097152

motion:
  # 未测得真实轮距前保持禁用；启用还要求 uart.enabled=true。
  enabled: false
  wheel_track_m: null
  # 以下是赛外调试的车端硬上限，远程请求超限会停车并报错，不会静默截断。
  max_linear_velocity_m_s: 0.25
  max_angular_velocity_rad_s: 1.0
  max_wheel_velocity_m_s: 0.30
  # 单轮目标速度变化率；0.5 m/s² 时从静止到 0.30 m/s 约需 0.6 秒。
  max_wheel_acceleration_m_s2: 0.50
  max_remote_command_valid_for_ms: 500
  gripper:
    # 必须先在真机逐侧测得安全端点和固定速度全行程时间，再启用持续扳机控制。
    enabled: false
    open_left_angle_deg: null
    open_right_angle_deg: null
    closed_left_angle_deg: null
    closed_right_angle_deg: null
    full_travel_time_s: null

tracking:
  confirmation_hits: 2
  max_association_ground_mm: 250.0
  min_association_iou: 0.10
  max_coast_ms: 600.0
  confidence_decay_per_second: 0.8
  min_confidence: 0.15

world:
  max_visual_age_ms: 250.0
  opponent_max_age_ms: 500.0
  danger_confirm_threshold: 0.60
  danger_suspect_threshold: 0.15
  unknown_suspect_threshold: 0.50
  # P3 场地区域冻结前保持为空；坐标为 FieldPoint 的 [x_mm, y_mm]。
  regions: []

mission:
  match_duration_s: 180.0
  no_motion_timeout_s: 15.0
  opponent_contact_timeout_s: 10.0
  danger_avoid_distance_mm: 500.0
  target_priority: [orange_injured, black_core, green_supply]

hailo:
  # 模板默认禁用；实际部署值写入不提交的 configs/runtime.yaml。
  enabled: false
  hef_path: null
  postprocess_onnx_path: null
  output_mapping_path: null
  model_version: null
  hef_sha256: null
  raw_classes: []
  class_mapping: {}
  backend_score_threshold: 0.01
  detection_threshold: 0.25
  semantic_threshold: 0.50
  k0_threshold: 0.50
  max_detections: 100
